apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: tenant-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-api
spec:
  replicas: 1 # POC outbox polling is not safe for horizontal replicas
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tenant-api
  template:
    metadata:
      labels:
        app: tenant-api
    spec:
      containers:
        - name: api
          image: tenant-control-plane-api:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: database-url
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-credentials
                  key: amqp-url
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
